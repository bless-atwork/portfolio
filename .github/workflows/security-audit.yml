name: Security audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # GitHub cron is UTC. 02:00 local time is installed separately on a machine.
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run local security audit
        run: python3 -m security_audit --ci
